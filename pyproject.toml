[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nolthira-agent-cli"
version = "0.2.0"
description = "Nolthira autonomous multi-agent AI orchestrator CLI with persistent memory, vision, MCP, and dynamic skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0"
]

[project.scripts]
nolthira = "nolthira.cli:main"
